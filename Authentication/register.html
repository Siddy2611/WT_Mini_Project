<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Expense Tracker</title>
    <link rel="stylesheet" href="register.css">

</head>
<body>

    <div class="register-box">

        <div class="left-section">
            <div class="logo">Expense<span>Tracker</span></div>
            <h1>Take control of your money.</h1>
            <p>Track your expenses and manage all your budgets.</p>

            <div class="features">

                <div class="feature">
                    <div class="feature-icon">₹</div>
                    Track your daily expenses
                </div>

                <div class="feature">
                    <div class="feature-icon">✓</div>
                    Manage your monthly budget
                </div>


                <div class="feature">
                    <div class="feature-icon"> % </div>
                    View your spending summary
                </div>

            </div>
        </div>

        <div class="right-section">

            <h2>Create Account</h2>
            <p class="subtitle">Start managing your finances today. </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    <div class="error" id="nameError"> </div>
                </div>

                <div class="form-group">
                    <label for="email">Email  </label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <div class="error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter 10 digit phone number">
                    <div class="error" id="phoneError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <div class="error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password">
                    <div class="error" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="register-btn"> Create Account </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html"> Login </a>
            </div>

        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
                event.preventDefault();

                let name =  document.getElementById("name").value.trim();
                let email =  document.getElementById("email").value.trim();
                let phone =  document.getElementById("phone").value.trim();
                let password =   document.getElementById("password").value.trim();
                let confirmPassword =  document.getElementById("confirmPassword").value.trim();
                let valid = true;

                if (name === "") {

                    document.getElementById("nameError").innerHTML = "Name is required";
                    valid = false;
                }

                if (email === "") {

                    document.getElementById("emailError").innerHTML = "Email is required";
                    valid = false;

                } else if (!email.includes("@")) {

                    document.getElementById("emailError").innerHTML = "Enter a valid email";
                    valid = false;
                }

                if (phone === "") {

                    document.getElementById("phoneError").innerHTML = "Phone number is required";
                    valid = false;

                } else if (!/^[0-9]{10}$/.test(phone)) {

                    document.getElementById("phoneError").innerHTML = "Enter a valid 10 digit phone number";
                    valid = false;
                }


                if (password === "") {

                    document.getElementById("passwordError").innerHTML = "Password is required";
                    valid = false;

                } else if (password.length < 6) {

                    document.getElementById("passwordError").innerHTML = "Password must contain at least 6 characters";
                    valid = false;
                }

                if (confirmPassword === "") {

                    document.getElementById("confirmPasswordError").innerHTML = "Please confirm your password";
                    valid = false;

                } else if (password !== confirmPassword) {

                    document.getElementById("confirmPasswordError").innerHTML = "Passwords do not match";
                    valid = false;
                }

                if (valid) {
                    window.location.href = "login.html";
                    alert("Registration successful!");

                }

            });

    </script>

</body>
</html>
